name: Actualitzar payloads

on:
  schedule:
    - cron: "0 7 * * *"  # cada dia a les 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar releases i actualitzar payloads.json
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_payloads.py

      - name: Commit i push si hi ha canvis
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          git commit -m "Auto-actualització diària de payloads"
          git push
